<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login — Driver Explorer Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo-svg" src="/refresh_14433.png" alt="Logo" width="48" height="48" style="object-fit: contain;" />
        <h1 class="login-title">Driver Explorer Panel</h1>
        <p class="login-subtitle">Acceso Corporativo Seguro</p>
      </div>
      
      <div class="login-entra-section">
        <button type="button" class="btn-entra" id="btn-login-entra">
          <svg class="ms-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
          Iniciar sesión con Microsoft Entra
        </button>
      </div>

      <div class="login-divider">
        <span></span>
      </div>

      <form id="login-local-form" class="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="login-error" style="display: none;"></div>
        <button type="submit" class="btn-local" id="btn-login-local">Acceder</button>
      </form>
    </div>
    <div class="login-footer">
      Protegido por políticas de seguridad corporativa.
    </div>
  </div>
  
  <script src="auth.js?v=1.0"></script>
</body>
</html>
